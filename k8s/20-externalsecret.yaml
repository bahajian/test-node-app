apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: test-node-secret
  namespace: test-node-app
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: test-node-secret        # k8s Secret ESO creates (used by the Deployment)
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: test-node-app        # -> Vault secret/data/test-node-app (all keys)
