apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: test-node-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: test-node-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: test-node-app      # -> Vault secret/data/test-node-app
