apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources land in this namespace (ArgoCD Application sets it too / CreateNamespace).
namespace: test-node-app

resources:
  - configmap.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml

# Single place to bump the deployed image. The CI pipeline tags images
# as sha-<commit>; update newTag here (or via `kustomize edit set image`)
# and ArgoCD rolls it out.
images:
  - name: nexus.ibstorm.com/test-node-app
    newTag: sha-d6c573b

labels:
  - pairs:
      app.kubernetes.io/part-of: test-node-app
    includeSelectors: false   # don't touch the immutable Deployment selector
